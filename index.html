<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>TQM Exam Prep</title>
<style>
:root{--bg:#fff;--fg:#1c2330;--mut:#5b6575;--card:#f4f6fa;--line:#d9dee7;--ac:#1f5fbf;--hl:#fff1a8;--hlfg:#1c2330;--ok:#1b7f4b;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--fg:#e6e9ef;--mut:#9aa4b5;--card:#1d232d;--line:#2d3644;--ac:#6ea8ff;--hl:#5a4d10;--hlfg:#fff3b8;--ok:#5fd394;--bad:#ff8a7a}}
:root[data-theme="dark"]{--bg:#14181f;--fg:#e6e9ef;--mut:#9aa4b5;--card:#1d232d;--line:#2d3644;--ac:#6ea8ff;--hl:#5a4d10;--hlfg:#fff3b8;--ok:#5fd394;--bad:#ff8a7a}
html{height:100%;scroll-padding-top:110px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 0}
.brand strong{font-size:17px}
#menu{display:none;margin-left:auto;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit;font-size:14px}
nav#top{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:thin}
nav#top button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:18px;padding:6px 13px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav#top button.on,#side button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1180px;margin:0 auto}
#side{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;padding:14px;border-right:1px solid var(--line)}
#side h4{margin:0 0 8px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
#side button{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;color:var(--fg);padding:9px 10px;border-radius:6px;font:inherit;font-size:14.5px;cursor:pointer;margin-bottom:2px}
#side button:hover{background:var(--card)}
main{padding:18px 20px 60px;min-width:0}
h1{font-size:25px;margin:.2em 0 .4em}h2{font-size:19px;margin:1.4em 0 .4em;border-left:4px solid var(--ac);padding-left:10px}h3{font-size:16px;margin:1em 0 .3em}
mark{background:var(--hl);color:var(--hlfg);padding:0 3px;border-radius:3px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
.def{border-left:4px solid var(--ok)}.tip{border-left:4px solid var(--bad)}
.kws{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.kws span{background:var(--hl);color:var(--hlfg);border-radius:14px;padding:2px 10px;font-size:13px;font-weight:600}
ul{padding-left:20px;margin:.4em 0}li{margin:.2em 0}
table{border-collapse:collapse;width:100%;font-size:14.5px}th,td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}th{background:var(--card)}
.tw{overflow-x:auto;margin:10px 0}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:12px 0}
.flow div{background:var(--card);border:1px solid var(--ac);border-radius:6px;padding:6px 10px;font-size:14px;text-align:center}
.flow i{align-self:center;color:var(--ac);font-style:normal;font-weight:700}
.mm{margin:14px 0}.mm .c{display:block;width:max-content;max-width:100%;margin:0 auto 12px;background:var(--ac);color:#fff;border-radius:22px;padding:8px 18px;font-weight:700;text-align:center}
.mm .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;border-top:2px solid var(--ac);padding-top:12px}
.mm .b{border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:6px;padding:8px 10px;background:var(--bg)}
.mm .b strong{display:block;color:var(--ac);font-size:14px;margin-bottom:3px}.mm .b ul{font-size:14px}
svg{max-width:100%;height:auto;display:block;margin:10px auto}svg text{fill:var(--fg);font:12px system-ui,sans-serif}svg .l{stroke:var(--fg);fill:none}svg .a{stroke:var(--ac);fill:none;stroke-width:2}svg .r{stroke:var(--bad);fill:none;stroke-dasharray:5 3}svg .f{fill:var(--ac)}
.hoq{display:grid;grid-template-columns:1fr 2fr;gap:4px;font-size:13px;text-align:center;max-width:560px;margin:12px auto}.hoq div{background:var(--card);border:1px solid var(--line);padding:8px 4px;border-radius:4px}.hoq .roof{grid-column:2;background:var(--hl);color:var(--hlfg)}.hoq .e{background:none;border:0}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:30px}.pn button{border:1px solid var(--ac);background:none;color:var(--ac);border-radius:6px;padding:8px 14px;font:inherit;cursor:pointer}
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.home button{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:12px;border-radius:8px;font:inherit;cursor:pointer}.home button b{display:block;color:var(--ac)}
@media(max-width:800px){#menu{display:block}.wrap{display:block}#side{display:none;position:static;max-height:50vh;border:0;border-bottom:1px solid var(--line);background:var(--bg)}#side.open{display:block}main{padding:14px 14px 50px}h1{font-size:22px}html{scroll-padding-top:150px}}

<script>

const M=(c,b)=>'<div class="mm"><span class="c">'+c+'</span><div class="g">'+b.map(y=>'<div class="b"><strong>'+y[0]+'</strong>'+L(y[1])+'</div>').join('')+'</div></div>';

const SV={
coq:'<svg viewBox="0 0 360 180"><path class="l" d="M40 10V150H340"/><path class="a" d="M40 140Q150 130 330 20"/><path class="r" d="M40 20Q130 110 330 140"/><path class="l" d="M40 30Q170 140 330 40"/><text x="240" y="14">Prevention + appraisal</text><text x="255" y="135">Failure cost</text><text x="140" y="108">Total cost</text><text x="140" y="172">Quality level →</text></svg>',

cc:'<svg viewBox="0 0 360 160"><path class="l" d="M30 10V150H350"/><path class="r" d="M30 35H350M30 125H350"/><path class="l" d="M30 80H350"/><polyline class="a" points="40,85 80,70 120,90 160,75 200,95 240,60 280,20 320,80"/><circle class="f" cx="280" cy="20" r="4"/><text x="352" y="38">UCL</text><text x="352" y="83">CL</text><text x="352" y="128">LCL</text><text x="215" y="16">Out of control</text></svg>',
tools:'<svg viewBox="0 0 380 190"><text x="5" y="14">Pareto chart</text><path class="l" d="M30 20V160H190"/><rect class="f" x="40" y="40" width="26" height="120"/><rect class="f" x="72" y="90" width="26" height="70"/><rect class="f" x="104" y="125" width="26" height="35"/><rect class="f" x="136" y="145" width="26" height="15"/><polyline class="r" points="53,40 85,25 117,22 149,20"/><text x="215" y="14">Fishbone (6M)</text><path class="l" d="M215 95H375M375 95l-10-8M375 95l-10 8M240 40L260 95M285 40L305 95M330 40L350 95M240 150L260 95M285 150L305 95M330 150L350 95"/><text x="225" y="35">Man</text><text x="270" y="35">Method</text><text x="313" y="35">Material</text><text x="220" y="165">Machine</text><text x="262" y="165">Measure</text><text x="310" y="165">Environment</text></svg>',
hoq:'<div class="hoq"><div class="e"></div><div class="roof">Roof: HOW vs HOW</div><div>WHATs + importance</div><div>HOWs</div><div>Competitor rating</div><div><b>Relationship matrix</b> 9 / 3 / 1</div><div class="e"></div><div>Priorities and targets</div></div>'};
const U=[
{n:'Unit 1',t:'Introduction',c:[
['TQM Framework',A('<mark>Total Quality Management (TQM)</mark> is a management approach in which everyone in the organisation works together to continuously improve products, services and processes so that the <mark>customer is satisfied</mark>.',
[['Customer focus','the customer decides quality; know and meet their needs'],['Leadership','top management sets vision, policy and gives resources'],['Employee involvement','everyone takes part and shares ideas'],['Process approach','improve the process, not just inspect the product'],['Continuous improvement','small improvements every day (Kaizen, PDCA)'],['Fact-based decisions','use data and statistics, not guesses'],['Supplier partnership','work with suppliers for good input quality']],
F(['Leadership + culture','Customer focus, involvement, process, suppliers','Tools: SPC, QFD, FMEA, 7 tools','Continuous improvement','Customer satisfaction'])+'<b>Benefits:</b>'+L(['Higher customer satisfaction and loyalty','Less waste, rework and cost','Better productivity and morale','Competitive advantage'])+'<b>Obstacles:</b>'+L(['Lack of management commitment','Resistance to change','Poor communication and training','Short-term thinking, silos, poor measurement']),
'TQM is not a one-time programme. It succeeds only when leadership, people, process and customer focus work together.',['Customer satisfaction','Continuous improvement','Employee involvement','Process approach','Leadership','Kaizen'])],
['Quality: Vision, Mission, Policy',A('<mark>Quality</mark> is the degree to which a product or service satisfies stated and implied customer needs. Juran: <mark>fitness for use</mark>. Crosby: <mark>conformance to requirements</mark>. Deming: meeting present and future customer needs.',
[['Vision','where the organisation wants to be in future; long-term and inspirational'],['Mission','why the organisation exists: what it does, for whom, how; present and practical'],['Quality policy','formal statement of top management’s commitment to quality'],['Policy contents (ISO 9001)','supports strategy, gives framework for objectives, commits to customer satisfaction and continual improvement'],['Features of a good policy','simple, communicated to all, reviewed regularly, covers entire workforce']],
'<b>Vision vs Mission</b>'+T(['Point','Vision','Mission'],[['Question','Where are we going?','Why do we exist?'],['Time','Long-term','Present, short-medium term'],['Nature','Inspirational, strategic','Practical, operational']])+'<b>Examples:</b>'+L(['Toyota vision: most successful and respected automobile company in the world','Xerox policy: quality is the job of every employee']),
'Clear vision, mission and policy give everyone one direction and make quality a commitment of top management.',['Fitness for use','Conformance','Future','Purpose','Top management commitment','Continual improvement'])],
['Cost of Quality',A('<mark>Cost of Quality (COQ)</mark> is the total cost spent to prevent poor quality, to check quality, and to fix failures. Also called the <mark>PAF model</mark>.',
[['Prevention cost','spent to stop defects: training, planning, supplier evaluation, preventive maintenance'],['Appraisal cost','spent to check quality: inspection, testing, audits, calibration'],['Internal failure cost','defects found before delivery: scrap, rework, downtime'],['External failure cost','defects found after delivery: warranty, complaints, recalls, loss of goodwill'],['Key idea','more spending on prevention greatly reduces failure cost']],
M('Cost of quality',[['Cost of good quality',['Prevention','Appraisal']],['Cost of poor quality',['Internal failure','External failure']]])+SV.coq,
'COQ shows where money is wasted. Investing in prevention is cheaper than correcting failures, so “quality is free”.',['PAF model','Prevention','Appraisal','Internal failure','External failure','Hidden cost','Goodwill'])],
['Customer: Focus, Perception, Retention',A('<mark>Customer focus</mark> means understanding and meeting customer needs better than competitors. Customers are <mark>internal</mark> (next department) and <mark>external</mark> (final users).',
[['Customer focus','know needs, deliver quality on time, communicate, handle complaints quickly'],['Customer perception','customer’s own judgement of quality, shaped by performance, price, service, brand and past experience'],['Expected vs perceived','perceived > expected = delight; equal = satisfaction; less = dissatisfaction'],['Translating needs into requirements','convert customer words into measurable specifications using surveys and QFD (“battery lasts longer” = 6000 mAh)'],['Customer retention','keeping customers buying again; a new customer costs 5–7 times more'],['Retention strategies','consistent quality, complaint handling, after-sales service, loyalty programmes, feedback']],
T(['Perceived vs expected','Result'],[['Perceived > Expected','Delight'],['Perceived = Expected','Satisfaction'],['Perceived < Expected','Dissatisfaction']])+F(['Customer need','Survey / VOC','QFD','Specification','Satisfied customer']),
'Satisfied, retained customers bring repeat business and profit, so every quality effort starts and ends with the customer.',['Internal customer','External customer','Perception','Delight','Retention','Loyalty'])],
['Dimensions of Product and Service Quality',A('Quality has several dimensions. <mark>Garvin’s 8 dimensions</mark> describe product quality and <mark>SERVQUAL (RATER)</mark> describes service quality.',
[['Performance','main working of the product'],['Features','extra secondary functions'],['Reliability','chance of no failure over time'],['Conformance','meets specification'],['Durability','useful life'],['Serviceability','ease and speed of repair'],['Aesthetics','look, feel, sound'],['Perceived quality','brand and reputation']],
M('SERVQUAL (service quality)',[['Reliability',['Dependable, accurate service']],['Assurance',['Knowledge, courtesy, trust']],['Tangibles',['Facilities, equipment, staff look']],['Empathy',['Individual care and attention']],['Responsiveness',['Willing, prompt help']]]),
'Product quality is judged on all 8 dimensions and service quality on the 5 RATER dimensions; good organisations measure each.',['Garvin','SERVQUAL','RATER','Reliability','Durability','Empathy'])]
]},
{n:'Unit 2',t:'Philosophies',c:[
['Quality Philosophies (Gurus)',A('Quality gurus gave the ideas behind TQM. Deming and Juran trained Japanese industry after World War II, which made Japan a global quality leader.',
[['Deming: improve the process','PDCA cycle and 14 points; most problems come from the system, not workers'],['Juran: fitness for use','Juran Trilogy: planning, control, improvement'],['Crosby: zero defects','4 absolutes; do it right the first time; quality is free'],['Feigenbaum: total quality control','quality is everyone’s job, not only inspection'],['Ishikawa: employee participation','fishbone diagram and quality circles'],['Taguchi: robust design','loss function; design quality in'],['Imai: Kaizen','small daily improvements by all']],
SV.pdca+'<b>Juran Trilogy:</b>'+F(['Quality planning','Quality control','Quality improvement'])+'<b>Crosby’s four absolutes:</b>'+L(['Quality = conformance to requirements','System = prevention','Standard = zero defects','Measurement = price of nonconformance'])+'<b>Deming’s 14 points (short):</b>'+L(['Constancy of purpose; new philosophy; stop mass inspection; no award on price alone','Improve constantly; train; lead; drive out fear; break barriers','No slogans or quotas; pride of workmanship; education; everyone works on transformation']),
'Each guru stresses a different part of quality, but all agree on prevention, leadership, people and continuous improvement.',['PDCA','14 points','Trilogy','Zero defects','Fishbone','Kaizen','Robust design'])],
['Japanese 5S',A('<mark>5S</mark> is a Japanese workplace organisation method for a clean, safe and efficient workplace. The five words start with S.',
[['Seiri (Sort)','remove unwanted items'],['Seiton (Set in order)','a place for everything, everything in its place'],['Seiso (Shine)','clean and inspect regularly'],['Seiketsu (Standardise)','make rules and visual controls for the first three S'],['Shitsuke (Sustain)','discipline; make it a habit']],
F(['Sort','Set in order','Shine','Standardise','Sustain'])+'<b>Benefits:</b>'+L(['Less waste and search time','Better safety, space and morale','Higher quality and productivity']),
'5S is the base of quality and lean; a tidy and disciplined workplace prevents errors.',['Seiri','Seiton','Seiso','Seiketsu','Shitsuke','Visual control'])],
['Supplier Partnership, Selection, Rating',A('<mark>Supplier partnership</mark> is a long-term cooperative relationship between buyer and supplier for mutual benefit in quality, cost and innovation. Quality begins with the quality of inputs.',
[['Why partner','poor raw material cannot give a good product'],['Principles of partnering','trust, open communication, shared goals, joint decisions, win-win'],['Benefits','consistent quality, less inspection, faster delivery, low inventory and cost'],['Supplier selection','define needs, find suppliers, pre-qualify, audit, select, contract'],['Selection criteria','quality system (ISO 9001), cost, delivery, capacity, financial stability, technical skill'],['Supplier rating','weighted score of performance, reviewed regularly']],
F(['Define needs','Identify suppliers','Pre-qualify','Evaluate / audit','Select','Contract','Monitor'])+T(['Rating parameter','Weight %'],[['Quality','40'],['Delivery','25'],['Cost','20'],['Service','10'],['Innovation','5']]),
'Partnership and rating turn suppliers into part of the quality system and reduce risk.',['Win-win','Pre-qualification','Supplier audit','Weighted rating','Long-term relationship'])],
['Loss Function and Quality Circle',A('<mark>Taguchi loss function</mark> says every deviation from the target causes loss, even inside specification limits. Loss = <mark>k (y − T)²</mark>.',
[['Traditional view','no loss inside limits, sudden loss outside'],['Taguchi view','minimum loss only at target; loss grows with square of deviation'],['Types','nominal-the-best, smaller-the-better, larger-the-better'],['Quality circle','voluntary group of 5–10 workers from same area who meet regularly to solve work problems'],['Circle structure','steering committee, coordinator, facilitator, leader, members'],['Circle process','identify problem, analyse causes, find solution, present to management, implement, review'],['Merits and limits','ownership, morale, lower defects; needs training and management support']],
SV.loss+'<b>Tools used by circles:</b> brainstorming, fishbone, Pareto, check sheet, histogram.',
'The loss function stresses design near target, and quality circles use workers’ knowledge to solve everyday problems.',['L = k(y−T)²','Target value','Robust design','Voluntary','Brainstorming','Ishikawa'])]
]},
{n:'Unit 3',t:'SPC',c:[
['SPC and Control Charts',A('<mark>Statistical Process Control (SPC)</mark> uses statistical tools, mainly <mark>control charts</mark>, to monitor a process, separate normal from abnormal variation and keep quality consistent.',
[['Variation','no process gives identical output'],['Common causes','natural, always present; process is in control'],['Assignable causes','specific and removable; process is out of control'],['Control chart','plot of data with centre line (CL), UCL and LCL at ±3σ'],['Out-of-control signs','point beyond limits, 7 points on one side, trend, cycle'],['Variables charts','X̄–R chart: X̄ for mean, R for spread; UCL = X̿ + A₂R̄, LCL = X̿ − A₂R̄; R chart: D₄R̄ and D₃R̄'],['Attribute charts','p (fraction defective), np (number defective), c (defects), u (defects per unit)']],
SV.cc+T(['Chart','Limits'],[['p','p̄ ± 3√(p̄(1−p̄)/n)'],['np','np̄ ± 3√(np̄(1−p̄))'],['c','c̄ ± 3√c̄'],['u','ū ± 3√(ū/n)']])+'<b>Example (n = 4):</b> means 30, 32, 30, 34, 31 give X̿ = 31.4, R̄ = 2. With A₂ = 0.729, limits are 29.94 and 32.86. Mean 34 is outside, so the process is out of control.',
'SPC finds problems early, so defects are prevented rather than inspected out.',['Common cause','Assignable cause','UCL / LCL','X̄–R chart','p chart','c chart','Stability'])],
['Process Capability',A('<mark>Process capability</mark> is the ability of a stable process to produce output within specification limits. Control asks “is it stable?”; capability asks “can it meet the specification?”.',
[['Specification limits','USL and LSL set by the customer'],['Cp','(USL − LSL) / 6σ; potential capability, ignores centring'],['Cpk','min[(USL − μ)/3σ, (μ − LSL)/3σ]; actual capability with centring'],['Interpretation','Cpk below 1 not capable; 1.33 or more capable; 2 very high'],['Measurement steps','check stability, collect data, find mean and σ, calculate Cp and Cpk, improve'],['Significance','shows whether process meets customer requirement and where to improve']],
T(['Value','Meaning'],[['< 1.00','Not capable'],['1.00','Marginal'],['≥ 1.33','Capable'],['≥ 2.00','Six Sigma level']])+'<b>Example:</b> USL = 40, LSL = 20, μ = 32, σ = 2. Cp = 20/12 = 1.67. Cpk = min(1.33, 2) = 1.33, so the process is off-centre.',
'A process must first be stable, then capable; Cpk is the true measure because it includes centring.',['USL','LSL','Cp','Cpk','Stable','Centring'])],
['Six Sigma',A('<mark>Six Sigma</mark> is a data-driven method to reduce variation and defects, aiming at only <mark>3.4 defects per million opportunities (DPMO)</mark>.',
[['Meaning of sigma','standard deviation, a measure of variation'],['Philosophy','reduce variation, reduce defects, improve quality, reduce cost'],['DMAIC','Define, Measure, Analyse, Improve, Control; for existing processes'],['DMADV','for designing new processes'],['Link to capability','six sigma process has Cp = 2'],['People','Champion, Master Black Belt, Black Belt, Green Belt']],
F(['Define','Measure','Analyse','Improve','Control'])+T(['Sigma level','DPMO'],[['3σ','66,807'],['4σ','6,210'],['5σ','233'],['6σ','3.4']]),
'Six Sigma links customer needs, process capability and defect reduction through a structured method.',['DPMO','DMAIC','Black belt','Variation','Sigma level'])],
['TPM and BPR',A('<mark>Total Productive Maintenance (TPM)</mark> keeps equipment in best condition through the involvement of all employees. <mark>Business Process Reengineering (BPR)</mark> is radical redesign of processes for dramatic improvement.',
[['TPM goals','zero breakdowns, zero defects, zero accidents'],['Autonomous maintenance','operators clean and check their own machines'],['Planned maintenance','scheduled preventive servicing'],['Other pillars','focused improvement, quality maintenance, early equipment management, training, office TPM, safety-health-environment'],['OEE','Availability × Performance × Quality'],['BPR','rethink and redesign processes to improve cost, quality, speed, service'],['BPR vs Kaizen','BPR is radical; Kaizen is gradual']],
F(['Identify process','Map as-is','Find gaps','Redesign to-be','Implement','Monitor'])+'<b>Six big losses:</b> breakdown, setup, minor stops, reduced speed, defects, start-up loss.',
'TPM improves equipment effectiveness and BPR improves the whole process; both support quality and productivity.',['OEE','8 pillars','Zero breakdown','Radical redesign','As-is / to-be'])]
]},
{n:'Unit 4',t:'Tools',c:[
['QFD and Voice of Customer',A('<mark>Quality Function Deployment (QFD)</mark> is a method that translates customer requirements (WHATs) into technical requirements (HOWs) at every stage of design and production.',
